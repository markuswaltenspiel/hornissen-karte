name: Daten aktualisieren

on:
  schedule:
    - cron: "17 4 * * *"   # täglich ca. 6 Uhr deutscher Zeit
  workflow_dispatch:        # manuell über "Run workflow"

permissions:
  contents: write

concurrency:
  group: aktualisieren
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Daten laden und aufbereiten
        run: python scraper/scrape.py
      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Daten $(date -u +%Y-%m-%d)"
            git push
          fi
